spring.application.name=xixu-server
server.port=${XIXU_PORT:18080}
server.address=${XIXU_BIND_ADDRESS:127.0.0.1}
spring.datasource.url=${XIXU_DB_URL:jdbc:mysql://127.0.0.1:3306/xixu_dev?useUnicode=true&characterEncoding=utf8}
spring.datasource.username=${XIXU_DB_USER}
spring.datasource.password=${XIXU_DB_PASSWORD}
spring.sql.init.mode=never
xixu.bootstrap.username=${XIXU_BOOTSTRAP_USERNAME:}
xixu.bootstrap.password=${XIXU_BOOTSTRAP_PASSWORD:}
